[package]
name = "audiveris-native"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Score image to MusicXML, following the Audiveris recognition pipeline"
publish = false

[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
